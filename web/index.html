<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中转下载器</title>
<script>
// 主题在样式生效前先落地, 避免刷新时闪一下白/黑
(function () {
  try {
    var p = localStorage.getItem('dlt_theme') || 'auto';
    var light = p === 'light' ||
      (p === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  } catch (e) {}
})();
</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --cy:#22d3ee; --ind:#6366f1; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    --ind-soft:rgba(99,102,241,.16); --ok-soft:rgba(34,197,94,.16);
  }
  /* 暗色 (默认) */
  :root, :root[data-theme="dark"]{
    --bg:#070a11; --panel:#111823; --panel2:#161f2d; --panel3:#1c2738; --line:#233044;
    --txt:#e8eefc; --dim:#8b9bb4; --dim2:#5d6c84;
    --glow1:rgba(99,102,241,.20); --glow2:rgba(34,211,238,.14);
    --shadow:rgba(0,0,0,.85);
    --flag-ring:rgba(255,255,255,.14);
  }
  /* 亮色 */
  :root[data-theme="light"]{
    --bg:#f3f6fc; --panel:#ffffff; --panel2:#f5f8fd; --panel3:#e9eff9; --line:#dce4f0;
    --txt:#152033; --dim:#5b6a82; --dim2:#8d9ab0;
    --glow1:rgba(99,102,241,.13); --glow2:rgba(34,211,238,.10);
    --shadow:rgba(30,55,100,.14);
    --flag-ring:rgba(0,0,0,.10);
  }
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100%; overflow-x:hidden; line-height:1.5;
    transition:background .25s ease,color .25s ease;
  }
  .glow{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(700px 380px at 12% -8%,var(--glow1),transparent 62%),
      radial-gradient(620px 340px at 88% 4%,var(--glow2),transparent 62%);
  }

  /* ---- 主题切换 ---- */
  .theme{position:fixed;top:18px;right:18px;z-index:20;display:flex;align-items:center;gap:2px;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;
    box-shadow:0 8px 22px -12px var(--shadow)}
  .theme button{background:transparent;border:0;color:var(--dim2);cursor:pointer;
    width:30px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    transition:all .18s;padding:0}
  .theme button:hover{color:var(--txt);background:var(--panel2)}
  .theme button.on{color:var(--ind);background:var(--ind-soft)}
  :root[data-theme="light"] .theme button.on{color:#4f46e5}
  .theme svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}

  main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:64px 20px 80px}
  header{text-align:center;margin-bottom:38px}

  /* ---- 访问验证页 (设置里开启"需要登录后才能使用"时显示) ---- */
  #boot{position:relative;z-index:1;text-align:center;color:var(--dim2);font-size:13px;
    margin-top:22vh}
  #gate{position:relative;z-index:1;max-width:400px;margin:14vh auto 0;padding:0 20px}
  #gate .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:34px 28px;box-shadow:0 22px 60px -28px var(--shadow);text-align:center}
  #gate .logo{width:52px;height:52px;margin:0 auto 16px;border-radius:15px;
    background:linear-gradient(135deg,var(--ind),var(--cy));display:flex;align-items:center;
    justify-content:center;box-shadow:0 12px 30px -12px rgba(99,102,241,.75)}
  #gate .logo svg{width:26px;height:26px}
  #gate h2{font-size:19px;font-weight:650;margin-bottom:6px}
  #gate .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  #gate .ginput{display:flex;gap:8px}
  #gate input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:11px;
    padding:12px 14px;color:var(--txt);font-size:14px;outline:0;font-family:inherit;min-width:0;
    transition:border-color .2s,box-shadow .2s}
  #gate input:focus{border-color:rgba(99,102,241,.65);box-shadow:0 0 0 4px rgba(99,102,241,.11)}
  #gate button{background:linear-gradient(135deg,var(--ind),#4f46e5);color:#fff;border:0;
    border-radius:11px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:filter .18s}
  #gate button:hover{filter:brightness(1.08)}
  #gate button:disabled{opacity:.6;cursor:default}
  #gate .gerr{color:var(--bad);font-size:12.5px;margin-top:12px;min-height:17px}
  .logo{width:60px;height:60px;margin:0 auto 18px;border-radius:17px;
    background:linear-gradient(135deg,var(--ind),var(--cy));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 34px -10px rgba(99,102,241,.75)}
  .logo svg{width:31px;height:31px}
  h1{font-size:27px;font-weight:650;letter-spacing:-.4px;margin-bottom:9px}
  header p{color:var(--dim);font-size:14px}
  header p b{color:var(--cy);font-weight:600}

  .inputcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:8px;display:flex;gap:8px;box-shadow:0 18px 44px -22px var(--shadow);
    transition:border-color .2s,box-shadow .2s}
  .inputcard:focus-within{border-color:rgba(99,102,241,.65);box-shadow:0 0 0 4px rgba(99,102,241,.11)}
  #url{flex:1;background:transparent;border:0;outline:0;color:var(--txt);
    font-size:14.5px;padding:13px 15px;font-family:inherit;min-width:0}
  #url::placeholder{color:var(--dim2)}
  #go{background:linear-gradient(135deg,var(--ind),#4f46e5);color:#fff;border:0;
    padding:0 26px;border-radius:11px;font-size:14.5px;font-weight:600;cursor:pointer;
    font-family:inherit;white-space:nowrap;transition:filter .18s,transform .1s}
  #go:hover{filter:brightness(1.13)}
  #go:active{transform:scale(.97)}
  #go:disabled{opacity:.55;cursor:default;filter:none}

  .hint{margin-top:12px;font-size:12.5px;color:var(--dim2);text-align:center}
  .hint code{background:var(--panel2);padding:2px 7px;border-radius:5px;color:var(--dim);
    font-size:11.5px;border:1px solid var(--line)}

  #result{margin-top:30px}
  .msg{padding:26px;text-align:center;color:var(--dim);font-size:14px}
  .msg.err{color:var(--bad);background:rgba(239,68,68,.07);
    border:1px solid rgba(239,68,68,.28);border-radius:13px;text-align:left;padding:16px 18px}
  .msg.err b{display:block;margin-bottom:4px;font-size:13px}
  .spin{width:19px;height:19px;border:2px solid var(--line);border-top-color:var(--cy);
    border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}

  .bar{display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;font-size:12.5px;color:var(--dim);gap:12px;flex-wrap:wrap}
  .bar .file{color:var(--txt);font-size:13px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;max-width:100%;font-weight:500}
  .bar .file span{color:var(--dim2);font-weight:400}

  .node{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin-bottom:11px;display:flex;align-items:center;gap:15px;
    animation:fade .32s ease both;transition:border-color .2s,transform .2s,background .25s}
  @keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .node:hover{border-color:#31425c}
  :root[data-theme="light"] .node:hover{border-color:#b9c7dd}
  .node.best{border-color:rgba(34,197,94,.5);background:
    linear-gradient(90deg,rgba(34,197,94,.075),transparent 55%),var(--panel)}
  .node.dead{opacity:.5}

  .rank{width:27px;height:27px;border-radius:9px;background:var(--panel2);color:var(--dim);
    display:flex;align-items:center;justify-content:center;font-size:12.5px;
    font-weight:700;flex-shrink:0;border:1px solid var(--line)}
  .node.best .rank{background:var(--ok-soft);color:#4ade80;border-color:rgba(34,197,94,.35)}
  :root[data-theme="light"] .node.best .rank{color:#16a34a}

  .info{flex:1;min-width:0}
  .nname{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;
    flex-wrap:wrap;margin-bottom:3px}
  .flag{width:21px;height:16px;border-radius:3px;object-fit:cover;flex-shrink:0;
    box-shadow:0 0 0 1px var(--flag-ring);vertical-align:-3px}
  .tag{font-size:10.5px;padding:1.5px 7px;border-radius:5px;font-weight:600;
    background:var(--ind-soft);color:#a5b4fc;border:1px solid rgba(99,102,241,.3)}
  :root[data-theme="light"] .tag{color:#4f46e5}
  .tag.rec{background:var(--ok-soft);color:#4ade80;border-color:rgba(34,197,94,.32)}
  :root[data-theme="light"] .tag.rec{color:#16a34a}
  .tag.master{background:rgba(34,211,238,.13);color:#67e8f9;border-color:rgba(34,211,238,.28)}
  :root[data-theme="light"] .tag.master{color:#0891b2}
  /* 卡片第二行只显示地区名 —— 刻意不显示节点地址(IP:端口),
     避免把节点位置直接暴露给随便路过的人 */
  .nsub{font-size:12px;color:var(--dim2);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}

  .lat{text-align:right;flex-shrink:0;min-width:74px}
  .latv{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .latu{font-size:10px;color:var(--dim2)}
  .g{color:var(--ok)} .y{color:var(--warn)} .o{color:#fb923c} .r{color:var(--bad)} .n{color:var(--dim2)}

  .dl{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    padding:9px 17px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
    text-decoration:none;white-space:nowrap;flex-shrink:0;font-family:inherit;
    transition:all .18s;display:inline-block}
  .dl:hover{background:var(--ind);border-color:var(--ind);color:#fff}
  .node.best .dl{background:linear-gradient(135deg,var(--ok),#16a34a);border-color:transparent;color:#fff}
  .node.best .dl:hover{filter:brightness(1.12)}
  .dl.off{pointer-events:none;opacity:.4}

  footer{text-align:center;margin-top:46px;font-size:12px;color:var(--dim2)}
  footer a{color:var(--dim2);text-decoration:none}
  footer a:hover{color:var(--cy)}
  @media(max-width:600px){
    main{padding:38px 14px 60px}
    h1{font-size:22px}
    .inputcard{flex-direction:column}
    #go{padding:13px}
    .node{flex-wrap:wrap;gap:11px}
    .lat{min-width:60px}
    .theme{top:12px;right:12px}
  }
</style>
</head>
<body>
<div class="glow"></div>

<div class="theme" id="themeBox">
  <button data-mode="light" title="白天"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg></button>
  <button data-mode="dark" title="夜晚"><svg viewBox="0 0 24 24"><path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5a8.6 8.6 0 1 0 11.3 11.3z"/></svg></button>
  <button data-mode="auto" title="跟随系统"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor" stroke="none"/></svg></button>
</div>

<main id="app" hidden>
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/>
      </svg>
    </div>
    <h1>中转下载器</h1>
    <p>粘贴下载地址，自动列出全部中转节点，<b>按你的实测延迟排序</b></p>
  </header>

  <div class="inputcard">
    <input id="url" type="text" spellcheck="false" autocomplete="off"
           placeholder="粘贴下载地址，例如 https://example.com/file.zip">
    <button id="go">解析</button>
  </div>
  <div class="hint">支持任意 http / https 直链 · 回车即可提交 · 也可直接拖入链接</div>

  <div id="result"></div>

  <footer>
    全程流式中转，不落盘、不留存文件 ·
    <a href="/admin">管理面板</a>
  </footer>
</main>

<div id="boot">正在加载…</div>

<!-- 访问验证页: 只有管理面板里开启"需要登录后才能使用"时才会出现 -->
<div id="gate" hidden>
  <div class="box">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/>
      </svg>
    </div>
    <h2>需要验证</h2>
    <div class="sub">本站已开启访问验证，请输入访问口令</div>
    <div class="ginput">
      <input type="password" id="gpw" autocomplete="current-password" placeholder="访问口令">
      <button id="gbtn">进入</button>
    </div>
    <div class="gerr" id="gerr"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const el = { url: $('#url'), go: $('#go'), res: $('#result') };
let seq = 0;
let curUrl = '';

/* ---------- 主题 ---------- */
const THEME_KEY = 'dlt_theme';
const mqLight = window.matchMedia('(prefers-color-scheme: light)');

function currentPref() {
  try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; }
}
function applyTheme(pref) {
  const light = pref === 'light' || (pref === 'auto' && mqLight.matches);
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  try { localStorage.setItem(THEME_KEY, pref); } catch (e) {}
  document.querySelectorAll('#themeBox button').forEach(b => {
    b.classList.toggle('on', b.dataset.mode === pref);
  });
}
document.querySelectorAll('#themeBox button').forEach(b => {
  b.onclick = () => applyTheme(b.dataset.mode);
});
mqLight.addEventListener('change', () => {
  if (currentPref() === 'auto') applyTheme('auto');
});
applyTheme(currentPref());

/* ---------- 工具 ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function flagHTML(code) {
  if (!code || !/^[A-Za-z]{2}$/.test(code)) return '';
  const c = code.toLowerCase();
  return '<img class="flag" alt="' + esc(code) + '" loading="lazy"' +
    ' src="https://flagcdn.com/24x18/' + c + '.png"' +
    ' srcset="https://flagcdn.com/48x36/' + c + '.png 2x"' +
    ' onerror="this.remove()">';
}

// 地区代码 -> 中文名。卡片第二行显示这个, 而不是节点地址(IP:端口)。
const REGION_NAME = {
  HK:'中国香港', MO:'中国澳门', TW:'中国台湾', CN:'中国大陆',
  JP:'日本', KR:'韩国', SG:'新加坡', MY:'马来西亚', TH:'泰国', VN:'越南',
  PH:'菲律宾', ID:'印度尼西亚', IN:'印度', AE:'阿联酋', TR:'土耳其',
  US:'美国', CA:'加拿大', MX:'墨西哥', BR:'巴西', AR:'阿根廷', CL:'智利',
  GB:'英国', IE:'爱尔兰', DE:'德国', FR:'法国', NL:'荷兰', BE:'比利时',
  LU:'卢森堡', CH:'瑞士', AT:'奥地利', IT:'意大利', ES:'西班牙', PT:'葡萄牙',
  SE:'瑞典', NO:'挪威', DK:'丹麦', FI:'芬兰', PL:'波兰', CZ:'捷克',
  RU:'俄罗斯', UA:'乌克兰', AU:'澳大利亚', NZ:'新西兰', ZA:'南非', IL:'以色列',
};
function regionLabel(code) {
  if (!code) return '中转节点';
  const k = String(code).toUpperCase();
  return REGION_NAME[k] || k;
}
function latClass(ms) {
  if (!isFinite(ms)) return 'n';
  if (ms < 100) return 'g';
  if (ms < 300) return 'y';
  if (ms < 800) return 'o';
  return 'r';
}
function latText(ms) {
  if (!isFinite(ms)) return '超时';
  if (ms < 1) return '<1';
  return Math.round(ms);
}
function fileName(u) {
  try {
    const p = new URL(u).pathname.split('/').filter(Boolean).pop();
    return p ? decodeURIComponent(p) : u;
  } catch (e) { return u; }
}

async function ping(base, rounds) {
  let best = Infinity;
  for (let i = 0; i < rounds; i++) {
    const t0 = performance.now();
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 6000);
    try {
      const r = await fetch(base + '/__ping?_=' + Date.now() + '_' + i, {
        cache: 'no-store', signal: ctl.signal
      });
      if (r.ok) {
        const d = performance.now() - t0;
        if (d < best) best = d;
      }
    } catch (e) { /* 节点不可达 */ }
    finally { clearTimeout(timer); }
  }
  return best;
}

/* ---------- 渲染 ---------- */
function render(nodes) {
  el.res.innerHTML = '';
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = '<div class="file">' + esc(fileName(curUrl)) +
    ' <span>· ' + nodes.length + ' 个节点</span></div><div>正在测速…</div>';
  el.res.appendChild(bar);

  const list = document.createElement('div');
  el.res.appendChild(list);

  const cards = nodes.map((n, i) => {
    const d = document.createElement('div');
    d.className = 'node';
    d.style.animationDelay = (i * 45) + 'ms';
    d.innerHTML =
      '<div class="rank">' + (i + 1) + '</div>' +
      '<div class="info">' +
        '<div class="nname">' + flagHTML(n.region) + esc(n.name) +
          (n.builtin ? '<span class="tag master">本机</span>' : '') +
          (n.region ? '<span class="tag">' + esc(n.region) + '</span>' : '') +
        '</div>' +
        '<div class="nsub">' + esc(regionLabel(n.region)) + '</div>' +
      '</div>' +
      '<div class="lat"><div class="latv n">—</div><div class="latu">延迟</div></div>' +
      '<a class="dl off" href="' + esc(n.link) + '">下载</a>';
    d._node = n;
    d._lat = Infinity;
    list.appendChild(d);
    return d;
  });

  return { bar, list, cards };
}

function sortCards(ctx) {
  const sorted = ctx.cards.slice().sort((a, b) => a._lat - b._lat);
  sorted.forEach((c, i) => {
    c.classList.toggle('best', i === 0 && isFinite(c._lat));
    c.classList.toggle('dead', !isFinite(c._lat));
    c.querySelector('.rank').textContent = i + 1;
    const t = c.querySelector('.tag.rec');
    if (i === 0 && isFinite(c._lat)) {
      if (!t) {
        const s = document.createElement('span');
        s.className = 'tag rec';
        s.textContent = '推荐';
        c.querySelector('.nname').appendChild(s);
      }
    } else if (t) { t.remove(); }
    ctx.list.appendChild(c);
  });
}

async function resolve() {
  const url = el.url.value.trim();
  if (!url) { el.url.focus(); return; }
  curUrl = url;
  const my = ++seq;

  el.go.disabled = true;
  el.res.innerHTML = '<div class="msg"><div class="spin"></div>正在解析地址…</div>';

  let data;
  try {
    const r = await fetch('/api/targets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    data = await r.json();
    // 401 = 本站开了访问验证而当前没通过 (或会话过期) -> 弹回验证页
    if (r.status === 401) {
      el.go.disabled = false;
      el.res.innerHTML = '';
      showGate('验证已失效，请重新输入访问口令');
      return;
    }
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  } catch (e) {
    if (my !== seq) return;
    el.go.disabled = false;
    el.res.innerHTML = '<div class="msg err"><b>无法解析这个地址</b>' + esc(e.message) + '</div>';
    return;
  }
  if (my !== seq) return;

  if (!data.nodes || !data.nodes.length) {
    el.go.disabled = false;
    el.res.innerHTML = '<div class="msg err"><b>没有可用的节点</b>' +
      '所有从节点都离线了。请到管理面板检查节点状态。</div>';
    return;
  }

  const ctx = render(data.nodes);
  const barMsg = ctx.bar.lastElementChild;
  barMsg.textContent = '正在测速 0/' + ctx.cards.length;

  let done = 0;
  await Promise.all(ctx.cards.map(async (c) => {
    c._lat = await ping(c._node.base, 3);
    done++;
    if (my !== seq) return;
    barMsg.textContent = '正在测速 ' + done + '/' + ctx.cards.length;
    const v = c.querySelector('.latv');
    v.textContent = latText(c._lat);
    v.className = 'latv ' + latClass(c._lat);
    c.querySelector('.dl').classList.remove('off');
    sortCards(ctx);
  }));

  if (my !== seq) return;
  const fast = ctx.cards.filter(c => isFinite(c._lat)).length;
  barMsg.innerHTML = '实测延迟排序 · <span style="color:var(--ok)">' +
    fast + ' 个可用</span>' + (fast < ctx.cards.length ?
    ' · <span style="color:var(--bad)">' + (ctx.cards.length - fast) + ' 个不可达</span>' : '') +
    ' · 令牌 ' + Math.round(data.expires_in / 60) + ' 分钟内有效';
  el.go.disabled = false;
}

el.go.addEventListener('click', resolve);
el.url.addEventListener('keydown', e => { if (e.key === 'Enter') resolve(); });

// 粘贴后自动解析
el.url.addEventListener('paste', () => {
  setTimeout(() => {
    const v = el.url.value.trim();
    if (/^https?:\/\/\S+$/i.test(v)) resolve();
  }, 60);
});

/* ---------- 访问验证 ----------
 * 管理面板里可以开启"需要登录后才能使用"。开启后先亮验证页, 通过了才显示主界面。
 * 真正的门禁在服务端(/api/targets 会返 401), 这里只是对应的界面。 */
const PENDING_URL = new URLSearchParams(location.search).get('url') || '';

function startApp() {
  $('#boot').hidden = true;
  $('#gate').hidden = true;
  $('#app').hidden = false;
  if (PENDING_URL) {         // 分享链接/书签带来的地址, 验证通过后再解析
    el.url.value = PENDING_URL;
    resolve();
  }
}

function showGate(msg) {
  $('#boot').hidden = true;
  $('#app').hidden = true;
  $('#gate').hidden = false;
  $('#gerr').textContent = msg || '';
  const p = $('#gpw');
  if (p) p.focus();
}

async function submitGate() {
  const pw = $('#gpw').value;
  if (!pw) { $('#gerr').textContent = '请输入访问口令'; return; }
  const b = $('#gbtn');
  b.disabled = true; b.textContent = '验证中…';
  try {
    const r = await fetch('/api/access/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || '口令不正确');
    $('#gpw').value = '';
    $('#gerr').textContent = '';
    startApp();
  } catch (e) {
    $('#gerr').textContent = e.message;
    $('#gpw').select();
  } finally {
    b.disabled = false; b.textContent = '进入';
  }
}

$('#gbtn').onclick = submitGate;
$('#gpw').addEventListener('keydown', e => { if (e.key === 'Enter') submitGate(); });

(async function init() {
  try {
    const r = await fetch('/api/access/status');
    const d = await r.json();
    if (d.required && !d.ok) { showGate(); return; }
  } catch (e) { /* 状态接口拿不到就别挡着用户, 直接进主界面 */ }
  startApp();
})();
</script>
