name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Windows 控制台默认不是 UTF-8, 测试输出含中文会 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: go vet
        run: go vet ./...

      - name: Build linux binaries (供 /bin/ 端点测试使用)
        shell: bash
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=0.0.0-ci" \
              -o "dist/dltunnel-linux-$arch" .
          done
          ls -lh dist/

      - name: Build host binary (Windows 上需要)
        shell: bash
        if: runner.os == 'Windows'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=0.0.0-ci" -o dist/dltunnel.exe .
          ls -lh dist/

      - name: Shell 脚本语法检查
        shell: bash
        run: bash -n install.sh && bash -n uninstall.sh && echo "install.sh / uninstall.sh 语法 OK"

      - name: 端到端回归测试
        shell: bash
        run: python test_e2e.py

      - name: 新功能测试
        shell: bash
        run: python test_features.py
