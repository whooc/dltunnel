name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag (如 v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        env:
          V: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p dist
          # 注入纯版本号 (去掉 tag 的 v 前缀), 展示时程序自己拼 v
          BARE="${V#v}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$BARE" \
              -o "dist/dltunnel-linux-$arch" .
          done
          chmod +x dist/*
          ls -lh dist/

      - name: Verify injected version
        run: |
          OUT="$(./dist/dltunnel-linux-amd64 -version)"
          echo "binary reports: $OUT"
          echo "$OUT" | grep -q "${{ steps.ver.outputs.tag }}" \
            || { echo "版本号注入失败: 期望包含 ${{ steps.ver.outputs.tag }}"; exit 1; }
          case "$OUT" in
            *vv*) echo "版本号重复了 v 前缀: $OUT"; exit 1 ;;
          esac

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/dltunnel-linux-amd64
            dist/dltunnel-linux-arm64
            install.sh
            uninstall.sh
          generate_release_notes: true
          draft: false
